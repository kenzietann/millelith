<section id="process" class="py-24 sm:py-32">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <div appReveal class="max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-600 dark:text-blue-400">
        Process
      </p>
      <h2
        class="mt-3 font-heading text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl dark:text-white"
      >
        How we work
      </h2>
      <p class="mt-4 text-lg leading-relaxed text-slate-600 dark:text-slate-300">
        Four steps, every engagement. No surprises in between.
      </p>
    </div>

    <div class="relative mt-16">
      <div
        class="absolute top-6 right-0 left-0 hidden h-px bg-slate-200 lg:block dark:bg-slate-800"
        aria-hidden="true"
      ></div>
      <ol class="grid gap-10 sm:grid-cols-2 lg:grid-cols-4 lg:gap-8">
        @for (step of steps; track step.title; let i = $index) {
          <li appReveal [appRevealDelay]="i * 0.1" class="relative">
            <div
              class="relative z-10 flex h-12 w-12 items-center justify-center rounded-full border border-slate-200 bg-white text-blue-600 shadow-sm dark:border-slate-700 dark:bg-slate-950 dark:text-blue-400"
            >
              <app-icon [name]="step.icon" class="h-5 w-5" />
            </div>
            <p class="mt-5 text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">
              Step {{ i + 1 }}
            </p>
            <h3 class="mt-1 font-heading text-lg font-semibold text-slate-900 dark:text-white">
              {{ step.title }}
            </h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">
              {{ step.description }}
            </p>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
