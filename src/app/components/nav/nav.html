<nav
  (document:keydown.escape)="closeMenu()"
  class="fixed inset-x-0 top-0 z-50 h-20 border-b border-slate-200 bg-white/80 backdrop-blur-md dark:border-slate-800 dark:bg-slate-950/80"
>
  <div class="mx-auto flex h-full max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a
      class="rounded-md font-heading text-lg font-bold tracking-tight text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 dark:text-white"
    >
      Millelith Security
    </a>

    <div class="hidden items-center gap-8 md:flex">
      <ul class="flex items-center gap-8">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              class="text-sm font-medium text-slate-600 transition-colors duration-200 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:text-white"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="toggleTheme()"
        class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full text-slate-600 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
        [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <app-icon [name]="isDark() ? 'sun' : 'moon'" class="h-5 w-5" />
      </button>

      <a
        href="#contact"
        class="hidden cursor-pointer items-center rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition-colors duration-200 hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 sm:inline-flex"
      >
        Get in touch
      </a>

      <button
        type="button"
        (click)="toggleMenu()"
        class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-full text-slate-600 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white md:hidden"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="mobileOpen() ? 'Close menu' : 'Open menu'"
      >
        <app-icon [name]="mobileOpen() ? 'close' : 'menu'" class="h-5 w-5" />
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div
      id="mobile-menu"
      class="border-t border-slate-200 bg-white px-4 pb-6 pt-2 dark:border-slate-800 dark:bg-slate-950 md:hidden"
    >
      <ul class="flex flex-col">
        @for (link of links; track link.href) {
          <li>
            <a
              [href]="link.href"
              (click)="closeMenu()"
              class="block rounded-md px-2 py-3 text-base font-medium text-slate-700 transition-colors duration-200 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 dark:text-slate-200 dark:hover:text-white"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a
        href="#contact"
        (click)="closeMenu()"
        class="mt-3 flex cursor-pointer items-center justify-center rounded-lg bg-blue-600 px-5 py-3 text-sm font-semibold text-white transition-colors duration-200 hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"
      >
        Get in touch
      </a>
    </div>
  }
</nav>
