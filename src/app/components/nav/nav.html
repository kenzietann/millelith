<nav
  (document:keydown.escape)="closeMenu()"
  class="fixed inset-x-0 top-0 z-50 h-16 border-b border-line bg-void/85 backdrop-blur-md"
>
  <div class="mx-auto flex h-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a
      href="#"
      class="flex items-center gap-3 font-mono text-sm font-bold tracking-tight text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-alert focus-visible:ring-offset-2 focus-visible:ring-offset-void"
    >
      <img src="millelith_white.png" alt="" class="h-7 w-auto" />
      <span class="glitch" data-text="MILLELITH">MILLELITH</span>
      <span class="hidden text-faint sm:inline">/</span>
      <span class="hidden font-normal text-dim sm:inline">SEC</span>
    </a>

    <div class="hidden items-center gap-8 md:flex">
      <ul class="flex items-center gap-7">
        @for (link of links; track link.href; let i = $index) {
          <li>
            <a
              [href]="link.href"
              class="group font-mono text-[11px] tracking-[0.18em] text-dim uppercase transition-colors duration-150 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-alert focus-visible:ring-offset-2 focus-visible:ring-offset-void"
            >
              <span class="text-faint transition-colors group-hover:text-alert">0{{ i + 1 }}</span>
              <span class="ml-1.5">{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="flex items-center gap-2">
      <a href="#contact" class="btn-alert hidden !px-4 !py-2 sm:inline-flex"> Get in touch </a>

      <button
        type="button"
        (click)="toggleMenu()"
        class="flex h-10 w-10 cursor-pointer items-center justify-center border border-transparent text-dim transition-colors duration-150 hover:border-line-strong hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-alert md:hidden"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="mobileOpen() ? 'Close menu' : 'Open menu'"
      >
        <app-icon [name]="mobileOpen() ? 'close' : 'menu'" class="h-5 w-5" />
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div id="mobile-menu" class="border-t border-line bg-void px-4 pt-2 pb-6 md:hidden">
      <ul class="flex flex-col">
        @for (link of links; track link.href; let i = $index) {
          <li>
            <a
              [href]="link.href"
              (click)="closeMenu()"
              class="flex items-baseline gap-3 border-b border-line py-3 font-mono text-sm tracking-[0.12em] text-ink uppercase transition-colors hover:text-alert focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-alert"
            >
              <span class="text-[11px] text-faint">0{{ i + 1 }}</span>
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a href="#contact" (click)="closeMenu()" class="btn-alert mt-4 w-full"> Get in touch </a>
    </div>
  }
</nav>
