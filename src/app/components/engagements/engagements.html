<section id="engagements" class="border-b border-line py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div appReveal class="max-w-2xl">
      <p class="section-kicker">Track record</p>
      <h2 class="section-title">In their words</h2>
    </div>

    <div class="mt-12">
      @for (org of orgs; track org.name) {
        <figure
          appReveal
          [appRevealDelay]="0.1"
          class="grid border-y border-line bg-panel md:grid-cols-[minmax(0,2fr)_minmax(0,3fr)]"
        >
          <div class="flex items-center justify-center border-b border-line px-8 py-10 md:border-r md:border-b-0">
            <app-org-logo [logo]="org.logo" [label]="org.name" class="h-20 text-ink" />
          </div>
          <div class="px-6 py-8 sm:px-10 sm:py-12">
            <blockquote class="max-w-2xl text-lg leading-relaxed text-ink sm:text-xl">
              &ldquo;{{ org.testimonial }}&rdquo;
            </blockquote>
            <figcaption class="mt-7 flex items-center gap-3 font-mono text-[12px] tracking-[0.12em] text-dim uppercase">
              <span class="h-px w-6 bg-alert" aria-hidden="true"></span>
              {{ org.name }}
            </figcaption>
          </div>
        </figure>
      }
    </div>
  </div>
</section>
