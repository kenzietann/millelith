<section id="engagements" class="border-b border-line py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div appReveal class="max-w-2xl">
      <p class="section-kicker">Track record</p>
      <h2 class="section-title">Organizations we have helped</h2>
      <p class="section-lede">Teams that have trusted us to help secure their systems.</p>
    </div>

    <div appReveal [appRevealDelay]="0.1" class="term brackets mt-14">
      <div class="term-bar">
        <div class="term-dots"><span></span><span></span><span></span></div>
        <span class="ml-1">engagements.log</span>
        <span class="ml-auto text-faint">tail -f</span>
      </div>

      <ul class="flex flex-wrap items-center justify-center gap-x-16 gap-y-10 px-8 py-12 sm:py-16">
        @for (org of orgs; track org.name) {
          <li class="text-dim transition-colors duration-150 hover:text-ink">
            <app-org-logo [logo]="org.logo" [label]="org.name" class="h-10 sm:h-12" />
          </li>
        }
      </ul>
    </div>
  </div>
</section>
