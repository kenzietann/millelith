<section aria-label="Company highlights" class="border-y border-slate-200 bg-white py-12 dark:border-slate-800 dark:bg-slate-950">
  <div class="mx-auto grid max-w-6xl grid-cols-2 gap-8 px-4 sm:px-6 lg:grid-cols-4 lg:px-8">
    @for (stat of stats; track stat.label; let i = $index) {
      <div appReveal [appRevealDelay]="i * 0.08" class="text-center lg:text-left">
        <p class="font-heading text-3xl font-bold text-slate-900 dark:text-white">{{ stat.value }}</p>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ stat.label }}</p>
      </div>
    }
  </div>
</section>
