<section aria-label="Company highlights" class="border-b border-line bg-panel">
  <!-- ticker -->
  <div class="overflow-hidden border-b border-line" aria-hidden="true">
    <div class="ticker-track flex w-max whitespace-nowrap py-2 font-mono text-[10px] tracking-[0.22em] text-faint uppercase">
      @for (pass of [0, 1]; track pass) {
        @for (item of ticker; track item) {
          <span class="px-6">{{ item }}<span class="ml-6 text-alert">//</span></span>
        }
      }
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-4 border-b border-line py-3 font-mono text-[11px] tracking-[0.18em] text-dim uppercase">
      <span class="flex items-center gap-2">
        <span class="h-1.5 w-1.5 bg-alert blink"></span>
        Live readout
      </span>
      <span class="hidden text-faint sm:inline">sys.status = operational</span>
      <span class="ml-auto text-faint">uptime: continuous</span>
    </div>

    <dl class="grid grid-cols-2 divide-line sm:grid-cols-3 lg:grid-cols-5 lg:divide-x">
      @for (stat of stats; track stat.key; let i = $index) {
        <div
          appReveal
          [appRevealDelay]="i * 0.06"
          class="group relative px-2 py-8 lg:px-6"
        >
          <dt class="font-mono text-[10px] tracking-[0.18em] text-faint uppercase">
            {{ stat.key }}
          </dt>
          <dd
            class="mt-2 font-mono text-3xl font-bold tracking-tight tabular-nums"
            [class.text-ink]="!stat.critical"
            [class.text-alert]="stat.critical"
            [class.drop-shadow-[0_0_12px_rgb(255_0_60/0.5)]]="stat.critical"
          >
            {{ stat.value }}
          </dd>
          <dd class="mt-1.5 text-sm text-dim">
            {{ stat.label }}
            @if (stat.critical) {
              <span class="sev sev-crit ml-2 align-middle">high</span>
            }
          </dd>
        </div>
      }
    </dl>
  </div>
</section>
